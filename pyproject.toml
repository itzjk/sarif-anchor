[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sarif-anchor"
version = "0.1.0"
description = "Check SARIF source citations against an explicit local Git commit."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["sarif", "git", "code-review", "security-tools", "cli", "report-validation", "continuous-integration"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Software Development :: Quality Assurance"]
dependencies = []

[project.urls]
Repository = "https://github.com/itzjk/sarif-anchor"
Issues = "https://github.com/itzjk/sarif-anchor/issues"

[project.scripts]
sarif-anchor = "sarif_anchor.cli:main"

[tool.setuptools]
packages = ["sarif_anchor"]
